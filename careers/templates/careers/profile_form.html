{% load static %}<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Career profile</title><link rel="stylesheet" href="{% static 'careers/app.css' %}"></head><body class="app"><main class="shell" style="max-width:650px"><a class="brand" href="{% url 'dashboard' %}">← Back to Dashboard</a><section class="card"><h1>{% if profile %}Edit profile{% else %}Create a career profile{% endif %}</h1><form method="post">{% csrf_token %}<label>Profile name</label><input name="name" required value="{{ profile.name|default:'' }}" placeholder="Python Developer Resume"><label>Target career</label><input name="target_career" list="career-options" value="{{ profile.target_career|default:'' }}" placeholder="Python Developer" autocomplete="off"><datalist id="career-options">{% for role in role_names %}<option value="{{ role }}">{% endfor %}</datalist><label>Career interests (comma separated)</label><input name="interests" list="career-interest-options" value="{{ profile.interests|join:', '|default:'' }}" placeholder="e.g. data science, design" autocomplete="off"><datalist id="career-interest-options">{% for role in role_names %}<option value="{{ role }}">{% endfor %}</datalist><button class="btn primary">Save profile</button>{% if not profile %}<a class="btn" href="{% url 'home' %}">Continue to analysis</a>{% endif %}</form></section></main><script src="{% static 'careers/autocomplete.js' %}"></script></body></html>
